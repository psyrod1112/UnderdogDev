# 1. 메인 서비스 (underdog.test)
server {
    listen 80;
    server_name underdog.test underdog-play.test;
    
    # 들어온 모든 HTTP 요청을 안전한 HTTPS로 301 영구 이동시킵니다.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name underdog.test;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    location / {
        default_type text/html;
        content_by_lua_block {
            ngx.say([[
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="utf-8">
                    <title>Underdog Main Portal</title>
                    <style>
                        body, html {
                            margin: 0;
                            padding: 0;
                            width: 100%;
                            height: 100%;
                            overflow: hidden;
                            background-color: #1e1e1e;
                            font-family: sans-serif;
                            color: white;
                        }
                        .header {
                            height: 40px;
                            background-color: #2d2d2d;
                            display: flex;
                            align-items: center;
                            padding: 0 20px;
                            font-weight: bold;
                            border-bottom: 1px solid #444;
                        }
                        .container {
                            width: 100%;
                            height: calc(100% - 40px);
                        }
                        iframe {
                            width: 100%;
                            height: 100%;
                            border: none;
                        }
                    </style>
                </head>
                <body>
                    <div class="header">
                        Underdog Main Portal (Embedded Playtest)
                    </div>
                    <div class="container">
                        <iframe src="https://ide-abc123.underdog-play.test"></iframe>
                    </div>
                </body>
                </html>
            ]])
        }
    }
}

# 2. 플레이테스트 서비스 (underdog-play.test)
server {
    listen 443 ssl;
    server_name underdog-play.test;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    location / {
        proxy_pass http://code_server:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # [필수] VS Code 웹소켓(WebSocket) 연결을 위한 헤더 설정
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 장시간 연결 끊김 방지
        proxy_read_timeout 86400s;
    }
}

#여기부터 찐 코드임.
resolver 127.0.0.11 valid=30s;

server {
    listen 443 ssl;
    server_name ~^ide-(?<subid>[a-zA-Z0-9_-]+)\.underdog-play\.test$;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    set $backend_upstream "";

    access_by_lua_block {
        local redis = require "resty.redis"
        local red = redis:new()
        red:set_timeout(1000) --1초 타임아웃

        -- 1. Redis 컨테이너 연결 (docker-compose 서비스 이름 사용)
        local ok, err = red:connect("redis", 6379)
        if not ok then
            ngx.log(ngx.ERR, "failed to connect to redis: ", err)
            return ngx.exit(500)
        end
        -- 2. Redis 비밀번호 인증
        local redis_pass = os.getenv("REDIS_PASSWORD")
        local res, err = red:auth(redis_pass)
        if not res then
            ngx.log(ngx.ERR, "failed to authenticate redis: ", err)
            return ngx.exit(500)
        end
        -- 3. Redis 키 조회(정규식 서브 id 추출 -> 키 조회 -> 타깃 설정)
        local key = "route:" .. ngx.var.subid
        local target, err = red:get(key)
        if not target or target == ngx.null then
            return ngx.exit(404)
        end
        ngx.var.backend_upstream = target
        red:set_keepalive(10000, 100)
    }

    location / {
        # Redis에서 가져온 주소로 실시간 프록시 중계
        proxy_pass http://$backend_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # VS Code 웹소켓(WebSocket) 필수 설정
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }
}