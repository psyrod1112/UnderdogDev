services:
  postgres:
    image: postgres:17
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: underdog_pg_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: underdog_pg_db
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    volumes:
      - redisdata:/data
    command: redis-server --requirepass ${REDIS_PASSWORD}

  openresty:
    image: openresty/openresty:alpine
    container_name: openresty_server
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/certs:/etc/nginx/certs
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      - postgres
      - redis
      - code-server

  code-server:
    image: codercom/code-server:latest
    container_name: code_server
    restart: always
    expose:
      - "8080"
    environment:
      - PASSWORD=${CODESERVER_PASSWORD}  # 웹에서 접속할 때 입력할 비밀번호
    volumes:
      - ./workspace:/home/coder/project     # 현재 프로젝트 폴더를 컨테이너 내부로 마운트

    command: ["--auth", "none"]

  api:
    build: ./backend
    container_name: fastapi_app
    restart: always
    expose
      - "8000"
volumes:
  pgdata:
  redisdata: