services:
  postgres:
    image: postgres:17
    container_name: postgres_pg
    restart: always
    environment:
      POSTGRES_USER: underdog_pg_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: underdog_pg_db
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: underdog_cache
    restart: always
    volumes:
      - redisdata:/data
    command: redis-server --requirepass ${REDIS_PASSWORD}

  openresty:
    image: openresty/openresty:alpine
    container_name: openresty_server
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - postgres
      - redis
volumes:
  pgdata:
  redisdata: